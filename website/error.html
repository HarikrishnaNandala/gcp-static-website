<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fc5c7d 0%, #6a3093 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 48px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .error-code {
            font-size: 5rem;
            font-weight: 700;
            color: #fc5c7d;
            line-height: 1;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.6rem;
            color: #2d3748;
            margin-bottom: 12px;
        }

        p {
            color: #718096;
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 24px;
        }

        a {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 12px 28px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s;
        }

        a:hover {
            background: #5a67d8;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <p>Oops! The page you're looking for doesn't exist or has been moved.</p>
        <a href="/">← Back to Home</a>
    </div>
</body>
</html>
